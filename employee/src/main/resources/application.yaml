server:
  port: 8081

spring:
  application:
    name: employee
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jwt:
    secret: ${JWT_SECRET}
  crypto:
    argon2:
      memory-kb: 65536
      iterations: 3
      parallelism: 4
      salt-length: 16
      hash-length: 32

app:
  admin:
    password: ${ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
